<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEB Explainers — Glossary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/geb.css">
<style>
.wrap{max-width:860px;margin:0 auto;padding:10px 22px 80px}
#q{width:100%;font-size:16px;padding:10px 14px;margin:10px 0 18px}
table{width:100%;border-collapse:collapse;font-size:17px}
th{font:600 12px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:8px;border-bottom:2px solid var(--rule)}
td{padding:10px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
td:first-child{font-weight:600;width:28%}
td:last-child{font:500 13px Inter,sans-serif;white-space:nowrap}
</style>
</head>
<body>
<div class="sitebar"><a href="./">← All chapters</a><span></span></div>
<header class="hero" style="padding-top:30px">
  <div class="kicker">GEB Explainers</div>
  <h1>Glossary</h1>
  <p class="lede">Every term the explainers define, in the order they first appear, with a link to where it was introduced.</p>
</header>
<main class="wrap">
  <input type="text" id="q" placeholder="Search terms…">
  <div id="out">Loading…</div>
</main>
<script src="assets/toc.js"></script>
<script>
(async function(){
  const out=document.getElementById('out');
  let md;
  try{ md=await (await fetch('GLOSSARY.md')).text(); }
  catch(e){ out.innerHTML='The glossary loads from <code>GLOSSARY.md</code>, which browsers block when a page is opened straight from disk. View it on the published site, or open GLOSSARY.md directly.'; return; }
  const ids=(window.GEB_TOC||[]).filter(e=>e.id);
  const rows=md.split('\n').filter(l=>/^\|/.test(l)).slice(2).map(l=>l.split('|').slice(1,-1).map(c=>c.trim()));
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  function render(f){
    f=(f||'').toLowerCase();
    const r=rows.filter(c=>!f||c.join(' ').toLowerCase().includes(f));
    out.innerHTML='<table><thead><tr><th>Term</th><th>Plain meaning</th><th>First in</th></tr></thead><tbody>'+
      r.map(([t,m,w])=>{const e=ids.find(x=>x.id.startsWith(w+'-'));return '<tr><td>'+esc(t)+'</td><td>'+esc(m)+'</td><td>'+(e?'<a href="'+e.id+'/">'+esc(e.title.split(':')[0])+'</a>':esc(w))+'</td></tr>';}).join('')+'</tbody></table>';
  }
  render(); document.getElementById('q').oninput=e=>render(e.target.value);
})();
</script>
</body>
</html>
